---
# Start consensus layer (Nimbus beacon)

- name: Wait for execution client Engine API to be responsive
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: "{{ nethermind_engine_port | default(8551) }}"
    delay: 10
    timeout: 120
    state: started
  when: not (ansible_check_mode | bool)

- name: Check if Nimbus data directory is empty
  ansible.builtin.find:
    paths: "{{ nimbus_data_dir }}"
    file_type: any
  register: nimbus_data_dir_contents

- name: Perform checkpoint sync if data directory is empty
  ansible.builtin.command:
    cmd: >
      {{ nimbus_beacon_bin }} trustedNodeSync
      --network={{ testnet_network }}
      --data-dir={{ nimbus_data_dir }}
      --trusted-node-url={{ checkpoint_sync_url }}
      --backfill=false
  register: checkpoint_sync_result
  changed_when: checkpoint_sync_result.rc == 0
  when: nimbus_data_dir_contents.matched == 0

- name: Start Nimbus beacon node
  ansible.builtin.systemd:
    name: consensus
    state: started
    enabled: true
  register: consensus_start

- name: Verify consensus service startup
  when: not (ansible_check_mode | bool)
  block:
    - name: Wait for consensus service to be active
      ansible.builtin.command: systemctl is-active consensus
      register: service_status
      until: service_status.stdout == 'active'
      retries: 10
      delay: 15
      changed_when: false
      failed_when: false

    - name: Fail if service did not start
      when: service_status.stdout != 'active'
      block:
        - name: Get consensus logs on failure
          ansible.builtin.command: journalctl -u consensus -n 50 --no-pager
          register: consensus_logs
          changed_when: false

        - name: Display consensus logs and fail
          ansible.builtin.fail:
            msg: |
              Consensus service failed to start. Current state is '{{ service_status.stdout }}'.
              Recent logs:
              {{ consensus_logs.stdout }}

    - name: Show success message and logs
      when: service_status.stdout == 'active'
      block:
        - name: Gather consensus service facts
          ansible.builtin.service_facts:

        - name: Display consensus client logs (last 20 lines)
          ansible.builtin.command: journalctl -u consensus -n 20 --no-pager
          register: consensus_logs
          changed_when: false

        - name: Show consensus startup status
          ansible.builtin.debug:
            msg:
              - "=== Consensus Layer Started ==="
              - "Service: consensus.service"
              - "Status: {{ ansible_facts.services['consensus.service'].state }}"
              - ""
              - "Recent logs:"
              - "{{ consensus_logs.stdout_lines[-10:] | join('\n') }}"
              - ""
              - "Note: Consensus client will sync from checkpoint. Monitor with:"
              - "  sudo journalctl -fu consensus"
