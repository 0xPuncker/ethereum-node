---
all:
  children:
    eth-validator:
      hosts:
        eth-validator-vm:
          ansible_host: "{{ ansible_host }}"
          ansible_user: "{{ ansible_user }}"
          ansible_ssh_private_key_file: ~/.ssh/id_ed25519
          ansible_python_interpreter: /usr/bin/python3
          ansible_ssh_common_args: "-o StrictHostKeyChecking=no"

  vars:
    # Network selection (holesky or hoodi)
    testnet_network: "hoodi"

    # Disk configuration
    disk_device: "/dev/sdb"
    mount_point: "/validator"
    filesystem: "ext4"

    # Network ports
    execution_p2p_port: 30303
    consensus_p2p_port: 9000

    # Fee recipient - MUST BE UPDATED WITH YOUR ETHEREUM ADDRESS
    fee_recipient_address: "0x9AD0D357391eXXXXXXXXXXXXXXXXX"

    # Checkpoint sync URL
    checkpoint_sync_url: "https://hoodi.beaconstate.ethstaker.cc"

    # Validator graffiti
    validator_graffiti: "EthCrew"

    # Validator keys availability flag
    validator_keys_available: true

    # Testing only: password used to encrypt generated keystore files
    deposit_cli_keystore_password: "JmhUGsCxX6J+#ZAbcx3rhe@123z^VI!4SXfMjJ"

    # Existing mnemonic for validator key generation (24 words)
    # deposit_cli_mnemonic: "{{ lookup('file', inventory_dir ~ '/../secure/mnemonic.txt') | trim }}"
