# For detailed hook docs see https://github.com/antonbabenko/pre-commit-terraform
# Configure Terraform cache if you want faster provider downloads:
#   export TF_PLUGIN_CACHE_DIR="$HOME/.terraform.d/plugin-cache"
#   mkdir -p "$TF_PLUGIN_CACHE_DIR"

repos:
  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.103.0
    hooks:
      - id: terraform_fmt
        name: terraform fmt
        files: ^terraform/modules/.+\.tf$
      - id: terraform_validate
        name: terraform validate
        files: ^terraform/modules/.+\.tf$
        args:
          - --hook-config=--tf-path=tofu
      - id: terraform_tflint
        name: terraform tflint
        files: ^terraform/modules/.+\.tf$
      - id: terraform_providers_lock
        name: terraform providers lock
        files: ^terraform/modules/.+\.tf$
        args:
          - --hook-config=--mode=only-check-is-current-lockfile-cross-platform
          - --args=-platform=linux_amd64
          - --args=-platform=darwin_amd64
          - --args=-platform=darwin_arm64
          - --args=-platform=windows_amd64

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: detect-private-key
